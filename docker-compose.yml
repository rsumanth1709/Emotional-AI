version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindcare_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mindcare.db
      - SECRET_KEY=${SECRET_KEY:-your-production-secret-key-change-this-mindcare-ai}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=http://localhost:3000
      - DEBUG=False
    volumes:
      - backend_data:/app/data
      - backend_chroma:/app/mindcare.chroma
      - backend_logs:/app/logs
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: mindcare_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
  backend_chroma:
  backend_logs:
